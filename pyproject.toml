[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudthrift"
version = "1.0.0"
description = "Enterprise FinOps MCP Server — autonomous cloud cost intelligence with human-in-the-loop remediation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "CloudThrift" }]
keywords = ["mcp", "finops", "aws", "cost-optimization", "cloud", "sre"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "mcp>=1.2.0",
    "boto3>=1.34.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "rich>=13.7.0",
    "click>=8.1.7",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "moto[ec2,s3,rds,elbv2,lambda,sts,ce]>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "boto3-stubs[ec2,s3,rds,elbv2,lambda,ce,sts]>=1.34.0",
    "freezegun>=1.4.0",
]

[project.scripts]
cloudthrift = "cloudthrift.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudthrift"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/cloudthrift --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
